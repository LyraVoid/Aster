name: Build Manager

on:
  push:
    tags: [ "*" ]
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'version.properties'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'version.properties'
  workflow_call:
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Mapped once, at job level, so every step can ask whether a key was provided: a step's own
    # env is not there yet when its if is evaluated. The names are the ones keystore.properties
    # uses, which is also what a release signed on a workstation reads.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The manager and the daemon each keep their own copy of KernelPatch's supercall numbers and
      # structs, and a copy that drifts fails on a device rather than here.
      - name: Check the supercall ABI against the kernel side
        run: python3 scripts/check_kp_abi.py

      - name: Generate version
        id: parse_version
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          source version.properties
          VERSION=$((managerVersionEpoch + COMMIT_NUM))
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup update stable
          cargo install cargo-ndk
          rustup target install aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Provide the signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > key.jks
          printf 'KEYSTORE_FILE=key.jks\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          chmod 600 key.jks keystore.properties

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          ./gradlew clean assembleDebug assembleRelease

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "mappings"
          path: "app/build/outputs/mapping/release/"

      - name: Upload build artifact1
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Aster-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.idsig

      - name: Upload build artifact2
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Aster-Debug
          path: |
            app/build/outputs/apk/debug/*.apk

      - name: Post to channel
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          if [ -n "${BOT_TOKEN}" ]; then
            CHANNELS=(-1002058433411 -1001910818234 -1002312454396)
            RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
            DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          
            for CHANNEL in "${CHANNELS[@]}"; do
              URL=$(python3 .github/scripts/telegram_url.py $CHANNEL)
              if [ -f "$RELEASE_APK" ] && [ -f "$DEBUG_APK" ]; then
                curl -v "$URL" -F "Release1=@$RELEASE_APK" -F "Release2=@$DEBUG_APK"
              fi
            done
          fi

      - name: Release apk
        if: ${{ env.KEYSTORE_BASE64 != '' && github.ref_type == 'tag' }}
        continue-on-error: true
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.parse_version.outputs.VERSION }}
          artifacts: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.idsig
          generateReleaseNotes: true
          makeLatest: true
          replacesArtifacts: true
